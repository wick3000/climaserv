<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instalaciones - Douglas</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:14px}
label{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase}
.sugerencias{position:absolute;z-index:50;background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;max-height:180px;overflow:auto;box-shadow:0 10px 20px rgba(0,0,0,.15)}
.sugerencias div{padding:10px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
/* BOTONES SEPARADOS - NINGUNO ENCIMA DEL OTRO */
#lista button, #listaRutaDia button, #listaMant button{position:relative;z-index:1;margin-bottom:6px;pointer-events:auto}
.btn-accion{margin-top:6px}
</style>
</head>
<body class="pb-24">
<div class="max-w-md mx-auto p-3">

<h1 class="text-xl font-black text-center">❄️ INSTALACIONES DOUGLAS</h1>
<p class="text-center text-xs text-slate-500 mb-3">Control de trabajos, ruta y mantenimiento</p>

<!-- TABS -->
<div class="grid grid-cols-4 gap-1 mb-3">
<button onclick="mostrar('trabajos')" class="bg-blue-600 text-white py-2 rounded-lg text-xs font-black">Trabajos</button>
<button onclick="mostrar('ruta')" class="bg-orange-500 text-white py-2 rounded-lg text-xs font-black">Ruta</button>
<button onclick="mostrar('mant')" class="bg-teal-600 text-white py-2 rounded-lg text-xs font-black">Mant.</button>
<button onclick="mostrar('catalogo')" class="bg-purple-600 text-white py-2 rounded-lg text-xs font-black">Catálogo</button>
</div>

<!-- ============ TRABAJOS ============ -->
<div id="tab-trabajos">
<div class="bg-white p-4 rounded-2xl shadow mb-3">
<h2 class="font-black mb-2">➕ Nueva Cotización</h2>
<div class="grid grid-cols-2 gap-2">
<div class="col-span-2 relative"><label>Cliente</label><input id="cliente" placeholder="Nombre del cliente" oninput="sugerirCliente(this.value)"><div id="sugCliente" class="sugerencias hidden"></div></div>
<div><label>Teléfono</label><input id="telefono" placeholder="7777-7777"></div>
<div><label>Fecha</label><input id="fecha" type="date"></div>
<div><label>Capacidad</label><select id="capacidadTrabajo"><option>9,000 BTU</option><option>12,000 BTU</option><option>18,000 BTU</option><option>24,000 BTU</option><option>36,000 BTU</option><option>48,000 BTU</option><option>60,000 BTU</option></select></div>
<div><label>Sistema</label><select id="sistema"><option>Mini Split Inverter</option><option>Mini Split Normal</option><option>Split Piso Techo</option><option>Cassette</option><option>Ventana</option><option>Portátil</option></select></div>
<div><label>Refrigerante</label><select id="refrigerante"><option>R410A</option><option>R32</option><option>R22</option></select></div>
<div><label>Zona / Lugar</label><input id="zona" placeholder="Ej: San Miguel"></div>
<div><label>Precio venta final $</label><input id="precio" type="number" placeholder="0"></div>
<div><label>Costo instalación $</label><input id="costo" type="number" placeholder="0"></div>
</div>
<button onclick="agregarTrabajo()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black mt-3">💾 GUARDAR COTIZACIÓN</button>
<button onclick="agregarOtroEquipo()" class="w-full bg-slate-200 py-2 rounded-xl font-bold text-xs mt-2">➕ Agregar otro equipo al mismo cliente</button>
</div>

<div class="flex gap-2 mb-2">
<input id="buscador" placeholder="🔍 Buscar cliente..." oninput="render()" class="flex-1">
<select id="filtroEstado" onchange="render()" class="w-32"><option value="todos">Todos</option><option value="pendiente">Pendientes</option><option value="realizado">Realizados</option></select>
</div>
<div id="resumen" class="text-xs font-bold text-slate-600 mb-2"></div>
<div id="lista"></div>
</div>

<!-- ============ RUTA ============ -->
<div id="tab-ruta" class="hidden">
<div class="bg-white p-4 rounded-2xl shadow mb-3">
<h2 class="font-black">🗺️ Ruta del Día</h2>
<input id="fechaRuta" type="date" onchange="render()" class="mt-2">
</div>
<div id="listaRutaDia"></div>
</div>

<!-- ============ MANTENIMIENTO ============ -->
<div id="tab-mant" class="hidden">
<div class="bg-white p-4 rounded-2xl shadow mb-3">
<h2 class="font-black mb-2">🛠️ Nuevo Mantenimiento</h2>
<div class="grid grid-cols-2 gap-2">
<div class="col-span-2"><label>Cliente</label><input id="mCliente" placeholder="Cliente"></div>
<div><label>Fecha</label><input id="mFecha" type="date"></div>
<div><label>Precio $</label><input id="mPrecio" type="number" placeholder="0"></div>
</div>
<button onclick="agregarMant()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-black mt-3">💾 GUARDAR MANTENIMIENTO</button>
</div>
<div id="listaMant"></div>
</div>

<!-- ============ CATALOGO ============ -->
<div id="tab-catalogo" class="hidden">
<div class="bg-white p-4 rounded-2xl shadow">
<h2 class="font-black mb-2">📦 Catálogo</h2>
<div class="grid grid-cols-2 gap-2">
<div><label>Capacidad</label><input id="cCap" placeholder="12,000 BTU"></div>
<div><label>Precio $</label><input id="cPrecio" type="number" placeholder="0"></div>
</div>
<button onclick="agregarCatalogo()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-black mt-3">Agregar al catálogo</button>
<div id="listaCatalogo" class="mt-3"></div>
</div>
</div>

</div>

<!-- MODAL REALIZADO -->
<div id="modalRealizado" class="hidden fixed inset-0 bg-black/60 flex items-end justify-center z-[100] p-3">
<div class="bg-white w-full max-w-md rounded-2xl p-4">
<h3 class="font-black text-center mb-1">✅ Marcar como Realizado</h3>
<p id="modalCliente" class="text-center text-xs text-slate-500 mb-3"></p>
<label>Costo real instalación $</label><input id="modalCosto" type="number" class="mb-2">
<label>Precio final cobrado $</label><input id="modalPrecioFinal" type="number" class="mb-3">
<!-- BOTONES UNO ABAJO DEL OTRO, NINGUNO ENCIMA -->
<button onclick="confirmarRealizado()" class="w-full bg-green-600 text-white py-3 rounded-xl font-black block">✓ REALIZADO</button>
<button onclick="cerrarModal()" class="w-full bg-slate-200 py-3 rounded-xl font-bold mt-2 block">Cancelar</button>
</div>
</div>

<script>
let datos = JSON.parse(localStorage.getItem('datos_douglas') || '[]');
let mants = JSON.parse(localStorage.getItem('mants_douglas') || '[]');
let catalogo = JSON.parse(localStorage.getItem('catalogo_douglas') || '[]');
let idxRealizado = null;
let idxEditar = null;

function save(){ localStorage.setItem('datos_douglas', JSON.stringify(datos)); localStorage.setItem('mants_douglas', JSON.stringify(mants)); localStorage.setItem('catalogo_douglas', JSON.stringify(catalogo)); render(); }
function mostrar(t){
  ['trabajos','ruta','mant','catalogo'].forEach(x=>document.getElementById('tab-'+x).classList.add('hidden'));
  document.getElementById('tab-'+t).classList.remove('hidden');
  render();
}
function hoy(){ return new Date().toISOString().slice(0,10); }
document.getElementById('fecha').value = hoy();
document.getElementById('fechaRuta').value = hoy();
document.getElementById('mFecha').value = hoy();

function sugerirCliente(v){
  let box=document.getElementById('sugCliente');
  if(!v){box.classList.add('hidden');return;}
  let unicos=[...new Set(datos.map(d=>d.cliente))].filter(c=>c.toLowerCase().includes(v.toLowerCase()));
  if(!unicos.length){box.classList.add('hidden');return;}
  box.innerHTML=unicos.map(c=>`<div onclick="elegirCliente('${c.replace(/'/g,"")}')">${c}</div>`).join('');
  box.classList.remove('hidden');
}
function elegirCliente(c){
  document.getElementById('cliente').value=c;
  let d=datos.find(x=>x.cliente===c);
  if(d){ document.getElementById('telefono').value=d.telefono||''; document.getElementById('zona').value=d.zona||''; }
  document.getElementById('sugCliente').classList.add('hidden');
}

function agregarTrabajo(){
  let cliente=document.getElementById('cliente').value.trim();
  if(!cliente) return alert('Pon el cliente');
  let d={cliente, telefono:document.getElementById('telefono').value, capacidadTrabajo:document.getElementById('capacidadTrabajo').value, sistema:document.getElementById('sistema').value, refrigerante:document.getElementById('refrigerante').value, zona:document.getElementById('zona').value, precio:parseFloat(document.getElementById('precio').value)||0, costo:parseFloat(document.getElementById('costo').value)||0, fecha:document.getElementById('fecha').value||hoy(), estado:'pendiente'};
  datos.unshift(d); save(); alert('✅ Guardado');
}
function agregarOtroEquipo(){
  let cliente=document.getElementById('cliente').value.trim();
  if(!cliente) return alert('Pon el cliente primero');
  let d=datos.find(x=>x.cliente===cliente);
  if(d){ document.getElementById('telefono').value=d.telefono||''; document.getElementById('zona').value=d.zona||''; }
  document.getElementById('precio').value=''; document.getElementById('costo').value='';
  document.getElementById('capacidadTrabajo').focus();
  alert('Listo, pon el otro equipo del mismo cliente');
}

// === BOTON CANCELAR ARREGLADO - NO TAPADO, UNO ABAJO DEL OTRO ===
function botonCancelarInstalacion(idx){
  return `<button type="button" style="position:relative;z-index:10;pointer-events:auto;" onclick="cancelarInstalacion(${idx})" class="bg-red-500 text-white px-4 py-2 rounded-full text-xs font-black block mt-2">❌ Cancelar</button>`;
}

// === FUNCION CANCELAR ARREGLADA - BORRA SOLO ESA COTIZACION ===
function cancelarInstalacion(idx){
  let i = Number(idx);
  let d = datos[i];
  if(!d) return alert('No encontré esa cotización. Recargá la página.');
  if(d.estado !== 'pendiente') return alert('Solo se puede cancelar una cotización pendiente.');
  let ok = confirm('¿Cancelar SOLO esta cotización?\n\nCliente: ' + d.cliente + '\nEquipo: ' + (d.capacidadTrabajo||'') + ' - ' + (d.sistema||'') + '\nPrecio: $' + (d.precio||0) + '\n\nEl cliente NO se borra, solo esta cotización.');
  if(!ok) return;
  datos.splice(i, 1);
  save();
  alert('❌ Cotización cancelada.');
}

function abrirRealizado(idx){
  idxRealizado=idx;
  let d=datos[idx];
  document.getElementById('modalCliente').textContent=d.cliente+' - '+d.capacidadTrabajo;
  document.getElementById('modalCosto').value=d.costo||'';
  document.getElementById('modalPrecioFinal').value=d.precio||'';
  document.getElementById('modalRealizado').classList.remove('hidden');
}
function cerrarModal(){ document.getElementById('modalRealizado').classList.add('hidden'); idxRealizado=null; }
function confirmarRealizado(){
  if(idxRealizado===null) return;
  datos[idxRealizado].estado='realizado';
  datos[idxRealizado].costo=parseFloat(document.getElementById('modalCosto').value)||datos[idxRealizado].costo;
  datos[idxRealizado].precio=parseFloat(document.getElementById('modalPrecioFinal').value)||datos[idxRealizado].precio;
  cerrarModal(); save();
}
function editarInstalacion(idx){
  let d=datos[idx];
  idxEditar=idx;
  document.getElementById('cliente').value=d.cliente;
  document.getElementById('telefono').value=d.telefono||'';
  document.getElementById('zona').value=d.zona||'';
  document.getElementById('precio').value=d.precio||'';
  document.getElementById('costo').value=d.costo||'';
  document.getElementById('fecha').value=d.fecha||hoy();
  document.getElementById('capacidadTrabajo').value=d.capacidadTrabajo;
  document.getElementById('sistema').value=d.sistema;
  mostrar('trabajos');
  let btn=document.querySelector('#tab-trabajos button');
  alert('Editando: '+d.cliente+'. Cambiá los datos y dale a ACTUALIZAR. Para guardar el cambio, borrá la vieja con Cancelar y guardá la nueva, o usá el botón de abajo.');
  // Guardar editado: reemplazamos el botón guardar temporalmente
  let guardar=document.querySelector('button[onclick="agregarTrabajo()"]');
  guardar.textContent='🔄 ACTUALIZAR COTIZACIÓN';
  guardar.onclick=function(){
    datos[idxEditar]={...datos[idxEditar], cliente:document.getElementById('cliente').value, telefono:document.getElementById('telefono').value, zona:document.getElementById('zona').value, precio:parseFloat(document.getElementById('precio').value)||0, costo:parseFloat(document.getElementById('costo').value)||0, fecha:document.getElementById('fecha').value, capacidadTrabajo:document.getElementById('capacidadTrabajo').value, sistema:document.getElementById('sistema').value, refrigerante:document.getElementById('refrigerante').value};
    guardar.textContent='💾 GUARDAR COTIZACIÓN';
    guardar.onclick=agregarTrabajo;
    save(); alert('✅ Actualizado');
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

function agregarMant(){
  let c=document.getElementById('mCliente').value.trim();
  if(!c) return alert('Pon cliente');
  mants.unshift({cliente:c, fecha:document.getElementById('mFecha').value||hoy(), precio:parseFloat(document.getElementById('mPrecio').value)||0, estado:'pendiente'});
  save(); alert('✅ Mantenimiento guardado');
}
function agregarCatalogo(){
  let cap=document.getElementById('cCap').value.trim();
  if(!cap) return alert('Pon capacidad');
  catalogo.push({cap, precio:parseFloat(document.getElementById('cPrecio').value)||0});
  save(); alert('✅ Agregado al catálogo');
}

function render(){
  let busc=(document.getElementById('buscador').value||'').toLowerCase();
  let filtro=document.getElementById('filtroEstado').value;
  let lista=datos.filter(d=>{
    if(busc && !d.cliente.toLowerCase().includes(busc)) return false;
    if(filtro!=='todos' && d.estado!==filtro) return false;
    return true;
  });
  // Agrupar por cliente
  let grupos={};
  lista.forEach(d=>{
    if(!grupos[d.cliente]) grupos[d.cliente]=[];
    grupos[d.cliente].push(d);
  });
  let html='';
  let totalPend=0, totalReal=0;
  datos.forEach(d=>{ if(d.estado==='pendiente') totalPend+=d.precio||0; else totalReal+=d.precio||0; });
  document.getElementById('resumen').textContent=`Pendiente: $${totalPend} | Realizado: $${totalReal} | Total: ${datos.length} cotizaciones`;

  Object.keys(grupos).forEach(cliente=>{
    html+=`<div class="bg-white rounded-2xl shadow p-3 mb-3"><div class="flex justify-between"><b>${cliente}</b><span class="text-xs text-slate-400">${grupos[cliente][0].telefono||''}</span></div>`;
    grupos[cliente].forEach(d=>{
      let idx=datos.indexOf(d);
      let color=d.estado==='pendiente'?'bg-yellow-100 text-yellow-800':'bg-green-100 text-green-800';
      html+=`<div class="border-t mt-2 pt-2">
      <div class="flex justify-between text-xs"><span>${d.fecha||''} • ${d.zona||''}</span><span class="px-2 py-0.5 rounded-full font-black ${color}">${d.estado}</span></div>
      <div class="text-sm font-bold">${d.capacidadTrabajo} - ${d.sistema}</div>
      <div class="text-xs text-slate-500">${d.refrigerante} • Cotizado $${d.precio} • Costo $${d.costo}</div>`;
      if(d.estado==='pendiente'){
        html+=`<div class="flex flex-col gap-1 mt-2">
        <button onclick="abrirRealizado(${idx})" class="w-full bg-green-600 text-white py-2 rounded-full text-xs font-black block">✅ Realizado</button>
        ${botonCancelarInstalacion(idx)}
        <button onclick="editarInstalacion(${idx})" class="w-full bg-blue-500 text-white py-2 rounded-full text-xs font-black block">✏️ Editar</button>
        </div>`;
      } else {
        html+=`<div class="text-xs mt-1 text-green-700 font-bold">✔ Cobrado $${d.precio}</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('lista').innerHTML=html||'<p class="text-center text-slate-400 text-sm">No hay cotizaciones</p>';

  // Ruta
  let fr=document.getElementById('fechaRuta').value||hoy();
  let ruta=datos.filter(d=>d.fecha===fr && d.estado==='pendiente');
  document.getElementById('listaRutaDia').innerHTML=ruta.map(d=>{
    let idx=datos.indexOf(d);
    return `<div class="bg-white rounded-2xl shadow p-3 mb-2"><b>${d.cliente}</b><div class="text-sm">${d.capacidadTrabajo} - ${d.sistema}</div><div class="text-xs text-slate-500">${d.zona} • $${d.precio}</div><div class="flex flex-col gap-1 mt-2"><button onclick="abrirRealizado(${idx})" class="w-full bg-green-600 text-white py-2 rounded-full text-xs font-black">✅ Realizado</button>${botonCancelarInstalacion(idx)}</div></div>`;
  }).join('') || '<p class="text-center text-slate-400 text-sm">Sin trabajos para esa fecha</p>';

  // Mant
  document.getElementById('listaMant').innerHTML=mants.map((m,i)=>`<div class="bg-white rounded-2xl shadow p-3 mb-2 flex justify-between"><div><b>${m.cliente}</b><div class="text-xs">${m.fecha} • $${m.precio}</div></div><button onclick="mants.splice(${i},1);save()" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs font-black">❌ Borrar</button></div>`).join('') || '<p class="text-center text-slate-400 text-sm">Sin mantenimientos</p>';

  // Catalogo
  document.getElementById('listaCatalogo').innerHTML=catalogo.map((c,i)=>`<div class="flex justify-between text-sm py-1 border-b"><span>${c.cap}</span><b>$${c.precio}</b></div>`).join('');
}
render();
</script>
</body>
</html>
